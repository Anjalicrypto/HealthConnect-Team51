
<template>
    <lightning-card title="HealthConnect - Quick Health Screening" icon-name="standard:patient">
        <div class="slds-p-around_medium">

            

            <lightning-input
                label="Blood Pressure"
                name="bloodPressure"
                placeholder="Example: 120/80"
                value={bloodPressure}
                onchange={handleChange}
                required>
            </lightning-input>

            <lightning-input
                type="number"
                label="Blood Sugar (mg/dL)"
                name="bloodSugar"
                min="1"
                max="600"
                value={bloodSugar}
                onchange={handleChange}
                required>
            </lightning-input>

            <lightning-textarea
                label="Symptoms"
                name="symptoms"
                value={symptoms}
                onchange={handleChange}>
            </lightning-textarea>

            <div class="slds-m-top_medium">
                <lightning-button
                    label="Save Health Assessment"
                    variant="brand"
                    onclick={handleSave}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
